plugins { id 'com.android.application' }

android {
    namespace 'com.moss.mmdbg'
    compileSdk 34

    defaultConfig {
        applicationId "com.moss.mmdbg"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("../keystore/mmdbg.jks")
            storePassword "modelmod123"
            keyAlias "modelmod"
            keyPassword "modelmod123"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
